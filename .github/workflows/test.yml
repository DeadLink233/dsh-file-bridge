name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.js
          node --check bridge.js
          node --check client.js
          node --check phone.html.js
          node --check qr.js
      - name: Smoke test
        run: node test/smoke.mjs